[package]
name = "crossfont"
# Deliberately on the 0.8.x line although the code tracks upstream master
# (merged through 0.9.0): `sctk-adwaita` — pulled in via winit's
# `wayland-csd-adwaita-crossfont` feature — requires `crossfont = "0.8.0"`,
# and a patched crate must satisfy every requirement in the graph. Bumping to
# 0.9.0 would break the Linux/Wayland build unless sctk-adwaita were forked
# too. See the versioning note in CHANGELOG.md.
version = "0.8.2"
description = "Cross platform native font loading and rasterization"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
repository = "https://github.com/alacritty/crossfont.git"
documentation = "https://docs.rs/crossfont"
license = "Apache-2.0"
readme = "README.md"
categories = ["gui", "os"]
keywords = ["font"]
edition = "2021"
rust-version = "1.77.0"

[dependencies]
libc = "0.2"
foreign-types = "0.5"
log = "0.4"

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
yeslogic-fontconfig-sys = "6.0.0"
freetype-rs = "0.36.0"

[target.'cfg(not(any(target_os = "macos", windows)))'.build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
core-text = "21.0.0"
core-graphics = "0.24.0"
core-foundation-sys = "0.8.4"
once_cell = "1.12"
objc2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = [
    "NSString",
    "NSUserDefaults",
    "NSValue",
] }

[target.'cfg(windows)'.dependencies]
dwrote = { version = "0.11" }
winapi = { version = "0.3", features = ["impl-default"] }
